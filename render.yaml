services:
  - type: web
    name: collaborator-ai-ws
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run ws:start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 1234
      - key: NODE_ENV
        value: production
      - key: ROOM_JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
